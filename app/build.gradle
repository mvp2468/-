// =========================================================================
// Combined Coverage Report (Unit Test + Instrumentation Test)
// Requires: connected device or emulator for instrumentation tests
// =========================================================================

task jacocoCombinedReport(type: JacocoReport) {
    group = "Reporting"
    description = "Generate combined JaCoCo coverage report (Robolectric + Espresso). Requires device/emulator."

    dependsOn 'testDevDebugUnitTest', 'connectedDevDebugAndroidTest'

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = file("$buildDir/reports/jacoco/combinedCoverage/html")
    }

    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', 'android/**/*.*', '**/databinding/**', '**/DataBinding*.*',
            '**/BR.*', '**/Hilt_*.*', '**/*_Factory.*', '**/*_MembersInjector.*',
            '**/Dagger*.*', '**/*_Provide*Factory.*', '**/*Binding.*', '**/*BindingImpl.*',
            '**/*$ViewBinder*.*', '**/*$ViewInjector*.*', '**/*Preview*.*',
            '**/shadow/**', '**/*Shadow*.*',
    ]

    def buildDirPath = layout.buildDirectory.get().asFile
    def jarFilePath = file("${buildDirPath}/intermediates/compile_app_classes_jar/devDebug/bundleDevDebugClassesToCompileJar/classes.jar")
    def explodedDirPath = file("${buildDirPath}/reports/jacoco/exploded-classes")
    def unitExecPath = file("${buildDirPath}/outputs/unit_test_code_coverage/devDebugUnitTest/testDevDebugUnitTest.exec")
    def ecDir = file("${buildDirPath}/outputs/code_coverage/devDebugAndroidTest/connected")

    doFirst {
        explodedDirPath.deleteDir()
        if (jarFilePath.exists()) {
            def excludes = ['databinding/', 'R.class', 'R$', 'BuildConfig.', 'Binding.', 'BindingImpl.'] as Set
            def zip = new java.util.zip.ZipFile(jarFilePath)
            zip.entries().each { entry ->
                if (!entry.isDirectory() && !excludes.any { entry.name.contains(it) }) {
                    def target = new File(explodedDirPath, entry.name)
                    target.parentFile.mkdirs()
                    target.withOutputStream { out ->
                        zip.getInputStream(entry).withStream { it.transferTo(out) }
                    }
                }
            }
            zip.close()
            println "Extracted classes from: ${jarFilePath}"
        }

        if (unitExecPath.exists()) {
            println "Unit test coverage: ${unitExecPath} (${unitExecPath.length()} bytes)"
        } else {
            println "WARNING: Unit test exec file not found."
        }

        def ecFiles = fileTree(dir: ecDir, includes: ["**/*.ec"])
        if (ecFiles.empty) {
            println "WARNING: No instrumentation .ec files found. Combined report will include unit test data only."
        } else {
            ecFiles.each { println "  Instrumentation coverage: ${it}" }
        }
    }

    def javacClassDir = fileTree(dir: "${buildDirPath}/intermediates/javac/devDebug/compileDevDebugJavaWithJavac/classes")
            .exclude(fileFilter)
    def explodedClassDir = fileTree(dir: "${buildDirPath}/reports/jacoco/exploded-classes").exclude(fileFilter)
    classDirectories.setFrom(files([javacClassDir, explodedClassDir]))

    sourceDirectories.setFrom(files([
            "src/main/java", "src/main/kotlin", "src/dev/java", "src/dev/kotlin"
    ]))

    // Merge unit test .exec + instrumented test .ec files
    def unitExecFile = file("${buildDirPath}/outputs/unit_test_code_coverage/devDebugUnitTest/testDevDebugUnitTest.exec")
    def ecTree = fileTree(dir: "${buildDirPath}/outputs/code_coverage/devDebugAndroidTest/connected", includes: ["**/*.ec"])

    def allData = files()
    if (unitExecFile.exists()) allData = allData + files(unitExecFile)
    if (!ecTree.empty) allData = allData + files(ecTree)
    executionData.setFrom(allData)
}

