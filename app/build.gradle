import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'kotlin-parcelize'
    id 'kotlinx-serialization'
    id 'jacoco'

    alias(libs.plugins.compose.compiler)
}

// Copy the signing.properties.sample file to ~/.sign/signing.properties and adjust the values.
final File PROD_PROPS_FILE = new File(System.getProperty('user.home'), '.sign/signing.properties')
final File REPO_PROPS_FILE = new File('repo.properties')
final Properties PROD_PROPS = loadProperties(PROD_PROPS_FILE)
final Properties REPO_PROPS = loadProperties(REPO_PROPS_FILE)

static def computeVersionName(versionCode, label) {
    return "${versionCode}-${label}-${(new Date()).format('yyyy-MM-dd')}"
}

android {
    compileSdk = 36

    compileOptions {
        coreLibraryDesugaringEnabled = true

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    defaultConfig {
        applicationId 'org.wikipedia'
        minSdk = 23
        targetSdk = 36
        versionCode 50586
        testApplicationId 'org.wikipedia.test'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true', timeout_msec: '300000'

        vectorDrawables.useSupportLibrary = true

        signingConfig = signingConfigs.debug

        buildConfigField "String", "DEFAULT_RESTBASE_URI_FORMAT", '"%1$s://%2$s/api/rest_v1/"'
        buildConfigField "String", "META_WIKI_BASE_URI", '"https://meta.wikimedia.org"'
        buildConfigField "String", "EVENTGATE_ANALYTICS_EXTERNAL_BASE_URI", '"https://intake-analytics.wikimedia.org"'
        buildConfigField "String", "EVENTGATE_LOGGING_EXTERNAL_BASE_URI", '"https://intake-logging.wikimedia.org"'
        def TEST_LOGIN_USERNAME = System.getenv('TEST_LOGIN_USERNAME') ?: "Hran666"
        def TEST_LOGIN_PASSWORD = System.getenv('TEST_LOGIN_PASSWORD') ?: "haoran050401"

        buildConfigField "String", "TEST_LOGIN_USERNAME", "\"${TEST_LOGIN_USERNAME}\""
        buildConfigField "String", "TEST_LOGIN_PASSWORD", "\"${TEST_LOGIN_PASSWORD}\""
    }

    // ── Quick Test Filter (must run at config time: afterEvaluate is too late) ──
    def isQuickAndroid = gradle.startParameter.taskNames.any { it.contains('quickAndroid') }
    if (isQuickAndroid) {
        def cacheDir = file("${rootDir}/.gradle/test-cache")
        def filterFile = file("${cacheDir}/android-test-filter.txt")
        def hashFile  = file("${cacheDir}/source-hash-android.txt")
        def passingFile = file("${cacheDir}/passing-android-tests.txt")

        def srcDirs = [
            "${rootDir}/app/src/main/java",       "${rootDir}/app/src/main/kotlin",
            "${rootDir}/app/src/androidTest/java","${rootDir}/app/src/androidTest/kotlin",
            "${rootDir}/app/src/dev/java",        "${rootDir}/app/src/dev/kotlin",
        ]
        def tokens = []
        srcDirs.each { dirPath ->
            def dir = file(dirPath)
            if (dir.exists()) {
                dir.eachFileRecurse { f ->
                    if (f.isFile() && f.name =~ /\.(kt|java)$/) {
                        tokens << "${f.absolutePath}:${f.lastModified()}"
                    }
                }
            }
        }
        def currentHash = tokens.sort().join('\n').md5()
        def isStale = !hashFile.exists() || hashFile.text.trim() != currentHash

        if (isStale) {
            println "[test-cache] ⚠ Android source changed → running ALL UI tests."
            if (passingFile.exists()) passingFile.delete()
            if (filterFile.exists())   filterFile.delete()
            if (hashFile.exists())     hashFile.delete()
        } else if (filterFile.exists()) {
            def filterText = filterFile.text.trim()
            if (!filterText.isEmpty()) {
                defaultConfig.testInstrumentationRunnerArguments['class'] = filterText
                def classCount = filterText.split(',').size()
                println "[test-cache] ✔ Android UI filter: ${classCount} test classes"
                println "[test-cache]   Skipping cached passing tests (run full suite with 'resetTestCache')"
            }
        }
    }

    testOptions {
        execution = 'host'
        animationsDisabled = true
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed"
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    sourceSets {

        ['prod', 'beta', 'alpha', 'dev', 'custom'].forEach { name ->
            maybeCreate(name).java.srcDirs += 'src/extra/java'
            maybeCreate(name).kotlin.srcDirs += 'src/extra/java'
            maybeCreate(name).res.srcDirs += 'src/extra/res'
        }

        maybeCreate('androidTest').assets.srcDirs += files("$projectDir/schemas".toString())
    }

    signingConfigs {
        prod {
            setSigningConfigKey(prod, PROD_PROPS)
        }
        debug {
            setSigningConfigKey(debug, REPO_PROPS)
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles 'test-proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles 'test-proguard-rules.pro'
        }
    }

    flavorDimensions = ['default']

    productFlavors {
        dev {
            versionName computeVersionName(defaultConfig.versionCode, 'dev')
            applicationIdSuffix '.dev'
            buildConfigField "String", "META_WIKI_BASE_URI", '"https://meta.wikimedia.beta.wmflabs.org"'
            buildConfigField "String", "EVENTGATE_ANALYTICS_EXTERNAL_BASE_URI", '"https://intake-analytics.wikimedia.beta.wmflabs.org"'
            buildConfigField "String", "EVENTGATE_LOGGING_EXTERNAL_BASE_URI", '"https://intake-logging.wikimedia.beta.wmflabs.org"'
        }
        prod {
            versionName computeVersionName(defaultConfig.versionCode, 'r')
            // Temporarily use debug signing for instrumentation testing.
            // Restore to signingConfigs.prod for release builds.
            signingConfig = signingConfigs.debug
        }
        alpha {
            versionName computeVersionName(defaultConfig.versionCode, 'alpha')
            applicationIdSuffix '.alpha'
        }
        beta {
            versionName computeVersionName(defaultConfig.versionCode, 'beta')
            applicationIdSuffix '.beta'
            signingConfig = signingConfigs.prod
        }
        fdroid {
            versionName computeVersionName(defaultConfig.versionCode, 'fdroid')
            signingConfig = signingConfigs.prod
        }
        custom {
            versionName computeVersionName(defaultConfig.versionCode, customChannel)
            // next line is for injecting a custom channel value into the custom/AndroidManifest.xml
            manifestPlaceholders = [customChannel:getProperty('customChannel').toString()]
            signingConfig = signingConfigs.prod
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                jvmArgs '-noverify'
                // Enable JaCoCo for Robolectric: include classes without debug location info
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }

                // ═══════════════════════════════════════════════════════
                // Test output logging — helps identify slow/flaky tests
                // ═══════════════════════════════════════════════════════
                testLogging {
                    events "passed", "skipped", "failed", "standardError"
                    showStandardStreams = false
                    exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
                }
            }
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled = true

        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }
    namespace = 'org.wikipedia'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}


apply plugin: 'jacoco'

apply from: '../gradle/src/ktlint.gradle'

// Test result caching — save passing tests to skip on next run
apply from: '../gradle/test-cache.gradle'

// ═══════════════════════════════════════════════════════════════════════
// Android (UI) Test Filter — integrates with test-cache.gradle
//
// Flow:
//   1. Run   connectedDevDebugAndroidTest  (full UI test run)
//   2. Run   cachePassingAndroidTests      (saves passing tests + generates filter)
//   3. Run   quickAndroidTest / quickAndroidProdTest (skips cached passing tests)
//   4. When source files change, the filter auto-clears → next run is full
//
// The filter file (.gradle/test-cache/android-test-filter.txt) is a
// comma-separated list of FQCNs to RUN (non-passing + new tests).
//
// CRITICAL: filter MUST be set inside android { } config block,
// because afterEvaluate runs AFTER variants are frozen.
// ═══════════════════════════════════════════════════════════════════════

afterEvaluate {
    def taskNames = gradle.startParameter.taskNames
    if (!taskNames.any { it.contains('quickAndroid') }) return

    // Disable orchestrator — it ignores class-level filtering
    android.testOptions.execution = 'host'
    ext.testCacheEnabled = true
}

jacoco {
    toolVersion = "0.8.11"
}

task jacocoTestReport(type: JacocoReport) {
    group = "Reporting"
    description = "Generate JaCoCo test coverage report"

    dependsOn 'testDevDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = file("$buildDir/reports/jacoco/testDevDebugUnitTestCoverage/html")
    }

    // Exclude generated classes: databinding, R, BuildConfig, etc.
    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            'android/**/*.*',
            '**/databinding/**',
            '**/DataBinding*.*',
            '**/BR.*',
            '**/Hilt_*.*',
            '**/*_Factory.*',
            '**/*_MembersInjector.*',
            '**/Dagger*.*',
            '**/*_Provide*Factory.*',
            '**/*Binding.*',
            '**/*BindingImpl.*',
            '**/*$ViewBinder*.*',
            '**/*$ViewInjector*.*',
            '**/*Preview*.*',
            // Exclude Robolectric shadows
            '**/shadow/**',
            '**/*Shadow*.*',
    ]

    // Capture buildDir paths at configuration time for configuration cache compatibility
    def buildDirPath = layout.buildDirectory.get().asFile
    def jarFilePath = file("${buildDirPath}/intermediates/compile_app_classes_jar/devDebug/bundleDevDebugClassesToCompileJar/classes.jar")
    def explodedDirPath = file("${buildDirPath}/reports/jacoco/exploded-classes")
    def execFilePath = file("${buildDirPath}/outputs/unit_test_code_coverage/devDebugUnitTest/testDevDebugUnitTest.exec")

    doFirst {
        // Unzip classes.jar: newer AGP packages Kotlin classes into a jar instead of extracting to directories
        explodedDirPath.deleteDir()
        if (jarFilePath.exists()) {
            def excludes = ['databinding/', 'R.class', 'R$', 'BuildConfig.', 'Binding.', 'BindingImpl.'] as Set
            def zip = new java.util.zip.ZipFile(jarFilePath)
            zip.entries().each { entry ->
                if (!entry.isDirectory() && !excludes.any { entry.name.contains(it) }) {
                    def target = new File(explodedDirPath, entry.name)
                    target.parentFile.mkdirs()
                    target.withOutputStream { out ->
                        zip.getInputStream(entry).withStream { it.transferTo(out) }
                    }
                }
            }
            zip.close()
            println "Extracted classes from: ${jarFilePath}"
        }

        if (!execFilePath.exists()) {
            println "WARNING: Execution data file not found at ${execFilePath}"
        } else {
            println "Using execution data: ${execFilePath} (${execFilePath.length()} bytes)"
        }
    }

    def javacClassDir = fileTree(dir: "${buildDirPath}/intermediates/javac/devDebug/compileDevDebugJavaWithJavac/classes")
            .exclude(fileFilter)
    def explodedClassDir = fileTree(dir: "${buildDirPath}/reports/jacoco/exploded-classes").exclude(fileFilter)
    classDirectories.setFrom(files([javacClassDir, explodedClassDir]))

    sourceDirectories.setFrom(files([
            "src/main/java",
            "src/main/kotlin",
            "src/dev/java",
            "src/dev/kotlin"
    ]))

    // Use explicit exec file path to ensure correct file is picked up
    def execFile = file("$buildDir/outputs/unit_test_code_coverage/devDebugUnitTest/testDevDebugUnitTest.exec")
    if (execFile.exists()) {
        executionData.setFrom(execFile)
    } else {
        executionData.setFrom(fileTree(dir: "$buildDir", includes: [
                "outputs/**/*.ec",
                "outputs/**/*.exec"
        ]))
    }
}

