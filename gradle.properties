android.useAndroidX=true
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Non-default Gradle performance settings
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.java=true

# Test result caching (skip passing tests on re-run)
# Set to false temporarily to force re-run all tests
test.cache.enabled=true
